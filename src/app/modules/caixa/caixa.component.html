<div class="card flex justify-content-center gap-2">
  <p-toast></p-toast>
  <p-confirmDialog
    header="Título do Diálogo"
    icon="pi pi-exclamation-triangle"
    [acceptLabel]="'OK'"
    [rejectVisible]="false"
    [closable]="false"
  ></p-confirmDialog>
</div>

<app-toolbar-navigation></app-toolbar-navigation>

<div>
  <div class="grid">
    <div class="col-12">
      <p-card header="Caixa" styleClass="shadow-3 m-1 ">
        <!--TABELA DE REGISTROS DE CAIXA-->
        <div *ngIf="!showForm" class="grid">
          <div class="col-12">
            <div class="flex justify-content-end"></div>
            <p-table
              #tabelaCaixa
              [columns]="colunasSelecionadas"
              [value]="caixaDatas"
              [(selection)]="caixaSelecionado"
              (onRowSelect)="onRowSelect($event)"
              selectionMode="single"
              [rows]="10"
              [paginator]="true"
              [resizableColumns]="true"
              columnResizeMode="fit"
              styleClass="p-datatable-gridlines"
              [tableStyle]="{ 'min-width': '50rem' }"
              [rowHover]="true"
              [showCurrentPageReport]="true"
              [rowsPerPageOptions]="[10, 25, 50, 100]"
              [globalFilterFields]="['codigo', 'dataAbertura', 'status', 'dataFechamento']"
              [exportHeader]="'customExportHeader'"
              dataKey="codigo"
              currentPageReportTemplate="Mostrando {first} de {last} de {totalRecords} registros"
              [filterDelay]="0"
            >
              <ng-template pTemplate="caption">
                <div class="flex">
                  <div class="mr-5">
                    <button
                      type="button"
                      class="mr-2"
                      pButton
                      pRipple
                      icon="pi pi-plus"
                      pTooltip="Abrir Caixa"
                      (click)="onAddButtonClick()"
                    >
                      Abrir Caixa
                    </button>
                  </div>

                  <div class="flex justify-content-center mr-5">
                    <button
                      type="button"
                      pButton
                      pRipple
                      icon="pi pi-file"
                      class="mr-2"
                      pTooltip="CSV - Exportar os dados da tabela com formato csv."
                      tooltipPosition="bottom"
                    ></button>
                    <button
                      type="button"
                      pButton
                      pRipple
                      icon="pi pi-file-excel"
                      class="p-button-success mr-2"
                      pTooltip="XLS - Exportar os dados da tabela com formato xls."
                      tooltipPosition="bottom"
                    ></button>
                    <button
                      type="button"
                      pButton
                      pRipple
                      icon="pi pi-file-pdf"
                      class="p-button-warning mr-2"
                      pTooltip="PDF - Exportar os dados da tabela com formato pdf."
                      tooltipPosition="bottom"
                    ></button>
                  </div>

                  <p-multiSelect
                    pTooltip="Desmarque as colunas que serão ocultadas"
                    [options]="cols"
                    [(ngModel)]="colunasSelecionadas"
                    optionLabel="header"
                    selectedItemsLabel="Ocultar Colunas"
                    [style]="{ 'min-width': '200px' }"
                    placeholder="Selecione as Colunas"
                  >
                  </p-multiSelect>

                  <span class="p-input-icon-left ml-auto mr-2 cursor-pointer">
                    <p-inputgroup>
                      <p-inputgroup-addon>
                        <i class="pi pi-search cursor-pointer"></i>
                      </p-inputgroup-addon>
                      <input
                        pInputText
                        type="text"
                        [(ngModel)]="valorPesquisa"
                        (input)="applyFilterGlobal($event, 'contains')"
                        placeholder="Pesquisar"
                      />
                    </p-inputgroup>
                  </span>
                  <button
                    pButton
                    label="Limpar"
                    class="p-button-outlined"
                    icon="pi pi-filter-slash"
                    (click)="clear(tabelaCaixa)"
                  ></button>
                  <button
                    pButton
                    class="p-button-outlined ml-3"
                    icon="pi pi-refresh"
                    (click)="atualizarTabela()"
                  ></button>
                </div>
              </ng-template>

              <ng-template pTemplate="header" let-columns>
                <tr>
                  <th style="width: 3rem">Ações</th>
                  <th *ngFor="let col of columns" pResizableColumn [pSortableColumn]="col.field">
                    <div class="flex justify-content-between align-items-center">
                      <div class="flex justify-content-between align-items-center">
                        {{ col.header }}
                      </div>
                      <div class="flex justify-content-between align-items-center">
                        <p-sortIcon field="{{ col.field }}"></p-sortIcon>
                        <p-columnFilter
                          type="text"
                          [field]="col.field"
                          display="menu"
                          matchMode="contains"
                          [showMatchModes]="true"
                          [showOperator]="false"
                          [showAddButton]="true"
                        ></p-columnFilter>
                      </div>
                    </div>
                  </th>
                </tr>
              </ng-template>

              <ng-template pTemplate="body" let-caixa let-columns="columns">
                <tr>
                  <td>
                    <div
                      class="flex justify-content-center gap-2 align-content-center align-items-center"
                    >
                      <button
                        pButton
                        pRipple
                        class="p-button-rounded p-button-text p-button-danger p-button-outlined"
                        icon="pi pi-lock"
                        pTooltip="Fechar Caixa"
                        (click)="onDisableButtonClick(caixa)"
                      ></button>
                      <button
                        pButton
                        pRipple
                        class="p-button-rounded p-button-text p-button-info p-button-outlined icon-color"
                        icon="pi pi-eye"
                        pTooltip="Visualizar Caixa"
                        (click)="visualizarCaixa(caixa)"
                      ></button>
                    </div>
                  </td>
                  <!-- <td>
                    <p-tableCheckbox [value]="usuario"></p-tableCheckbox>
                  </td> -->
                  <!-- <td>{{ caixa.codigo }}</td> -->
                  <ng-container *ngFor="let col of columns">
                    <td *ngIf="col.field !== 'status'; else statusColumn">
                      {{ caixa[col.field] }}
                    </td>
                    <ng-template #statusColumn>
                      <td>
                        <p-tag [value]="caixa.status"></p-tag>
                      </td>
                    </ng-template>
                  </ng-container>
                </tr>
              </ng-template>

              <ng-template pTemplate="summary">
                <div class="text-center">
                  Total de {{ caixaDatas ? caixaDatas.length : 0 }} Caixas Registrados.
                </div>
              </ng-template>

              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="8">Nenhum informação foi encontrada.</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>

        <!--FORMULARIO DE USUARIOS-->
        <div *ngIf="showForm" class="mt-2">
          <div class="gap-4">
            <form [formGroup]="caixaForm" (ngSubmit)="abrirCaixa()">
              <div class="card flex flex-column md:flex-column gap-4">
                <div class="flex flex-row">
                  <div class="flex flex-column mr-2">
                    <label for="label">Código</label>
                    <input pInputText formControlName="codigo" />
                  </div>

                  <div class="flex flex-column mr-2">
                    <label for="label">Status</label>
                    <input pInputText formControlName="status" />
                  </div>

                  <div class="flex flex-column mr-2">
                    <label for="label">Empresa</label>
                    <input pInputText value="1" disabled/>
                  </div>

                  <div class="flex flex-column mr-2">
                    <label for="label">Data Abertura</label>
                    <input pInputText type="text" formControlName="dataAbertura" />
                  </div>
                  <div class="flex flex-column mr-2">
                    <label for="label">Data Fechamento</label>
                    <input pInputText type="text" formControlName="dataFechamento" />
                  </div>
                </div>

                <div class="flex flex-row">
                  <div class="p-float-label flex flex-column mr-4">
                    <label for="float-label">Saldo Inicial</label>
                    <p-inputNumber
                      mode="currency"
                      currency="BRL"
                      locale="pt-BR"
                      formControlName="saldoInicial"
                      style="width: 200px"
                    />
                  </div>
                  <div class="p-float-label flex flex-column mr-4">
                    <label for="float-label">Saldo Final</label>
                    <p-inputNumber
                      mode="currency"
                      currency="BRL"
                      locale="pt-BR"
                      formControlName="saldoFinal"
                      style="width: 200px"
                    />
                  </div>
                </div>

                <div class="flex flex-row">
                  <div class="p-float-label flex flex-column mr-4">
                    <label for="float-label">Entradas</label>
                    <p-inputNumber
                      mode="currency"
                      currency="BRL"
                      locale="pt-BR"
                      formControlName="totalEntradas"
                      style="width: 200px"
                    />
                  </div>
                  <div class="p-float-label flex flex-column mr-4">
                    <label for="float-label">Saídas</label>
                    <p-inputNumber
                      mode="currency"
                      currency="BRL"
                      locale="pt-BR"
                      formControlName="totalSaidas"
                      style="width: 200px"
                    />
                  </div>
                  <div class="p-float-label flex flex-column mr-4">
                    <label for="float-label">Diferença</label>
                    <p-inputNumber
                      mode="currency"
                      currency="BRL"
                      locale="pt-BR"
                      formControlName="diferenca"
                      style="width: 200px"
                    />
                  </div>
                </div>
              </div>
            </form>

            <div class="mt-2">
              <div class="card flex flex-column md:flex-column gap-4">
                <div
                  class="flex flex-row justify-content-left align-content-center align-itens-center m-1"
                >
                  <p-button
                  *ngIf="!visualizar && !fechamentoCaixa"
                    class="mr-2"
                    (onClick)="abrirCaixa()"
                    type="submit"
                    label="Confirmar"
                  ></p-button>
                   <p-button
                    *ngIf="fechamentoCaixa"
                    class="mr-2"
                    (onClick)="fecharCaixa()"
                    label="Confirmar Fechamento"
                  ></p-button>
                  <p-button
                  *ngIf="!visualizar"
                    type="submit"
                    label="Cancelar"
                    styleClass="red-button"
                    (onClick)="cancelarFormulario()"
                  ></p-button>
                  <p-button
                    *ngIf="visualizar"
                    class="mr-2"
                    (onClick)="cancelarVisualizacao()"
                    label="Voltar"
                  ></p-button>
                 
                </div>
              </div>
            </div>
          </div>
        </div>
      </p-card>
    </div>
  </div>
</div>
